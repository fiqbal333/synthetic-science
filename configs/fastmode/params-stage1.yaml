  p_offer_verify: 0.95              # kept: capacity-bound, not re-identified
  response: {defend: 0.0, revise: 0.491, withdraw: 0.509}
  p_request_n: 0.98               # fresh-data agenda items that name a dataset size
  request_n_multiple: {1.48: 0.1, 2.47: 0.1, 3.52: 0.1, 4.45: 0.1, 6.22: 0.1, 7.41: 0.1, 10.39: 0.1, 12.77: 0.1, 14.49: 0.1, 26.81: 0.1}   # requested N / the question's median frame N (deciles)
  stake: {"p_stake": 0.3, "amount_weights": {"5": 0.5, "10": 0.35, "20": 0.15}, "p_for_given_endorse_logit": 0.8}   # declared (kept): variant d not run
  p_challenge_with_test: 0.1       # declared (kept): variant c not run
verifier:
  p_handle: VERIFIED
  factor_tolerance: 2.0           # kept
handbook:
  w_B1: 0.19
  w_B2: 0.03
  w_B3: 0.78
  confidence_scale: 0.764
  p_no_evidence_when_uncovered: 0.836
