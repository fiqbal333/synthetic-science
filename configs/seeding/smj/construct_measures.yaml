# DECLARED mapping from harmonized constructs (02b/03a names) to a measured variable family (03g) and a codebook definition.
# Raw-scale means and SDs are read from 03g at generation time; `kind` decides rounding/binarization.
# `secondary` is the alternative measure of the same construct used as the secondary DV (hypotheses are stated among the focal variables).
constructs:
  accounting_performance: {var: roa, family: roa, kind: ratio, source: archival, label: "Return on assets", definition: "Net income divided by total assets, fiscal year", unit: "fraction", secondary: {var: ros, family: ros, label: "Return on sales", definition: "Operating income divided by sales"}}
  market_performance:     {var: tobins_q, family: tobins_q, kind: continuous, source: archival, label: "Tobin's q", definition: "Market value of assets divided by book value of assets", unit: "ratio", secondary: {var: stock_return, family: stock_return_car, label: "Annual stock return", definition: "Buy-and-hold return over the fiscal year"}}
  innovation_output:      {var: ln_patents, family: patent_count, kind: continuous, source: archival, label: "Patent output", definition: "Natural log of one plus the number of patents granted in the year", unit: "log count", secondary: {var: ln_citations, family: citation_count, label: "Citation-weighted patents", definition: "Natural log of one plus forward citations to the year's patents"}}
  innovation_input:       {var: rnd_intensity, family: rnd_intensity, kind: ratio, source: archival, label: "R&D intensity", definition: "R&D expenditure divided by sales", unit: "fraction"}
  firm_survival:          {var: survived, family: survival_exit, kind: binary, source: archival, label: "Survival", definition: "1 if the firm is still operating at the end of the observation window, 0 if it exited", unit: "indicator", secondary: {var: ln_duration, family: experience, label: "Years of operation", definition: "Natural log of years from founding to the end of the window or exit"}}
  corporate_transactions: {var: ln_acquisitions, family: acquisitions_ma, kind: continuous, source: archival, label: "Acquisition activity", definition: "Natural log of one plus the number of acquisitions completed in the year", unit: "log count", secondary: {var: deal_value, family: ma_deal_characteristics, label: "Relative deal value", definition: "Total value of the year's deals divided by firm assets"}}
  diversification:        {var: diversification, family: diversification_product, kind: continuous, source: archival, label: "Product diversification", definition: "Entropy index of sales across four-digit industry segments", unit: "index"}
  internationalization:   {var: foreign_sales_ratio, family: foreign_internationalization, kind: ratio, source: archival, label: "Internationalization", definition: "Foreign sales divided by total sales", unit: "fraction"}
  alliances:              {var: ln_alliances, family: alliances_jv, kind: continuous, source: archival, label: "Alliance activity", definition: "Natural log of one plus the number of alliances formed in the year", unit: "log count"}
  experience_learning:    {var: ln_experience, family: experience, kind: continuous, source: archival, label: "Prior experience", definition: "Natural log of one plus the cumulative count of prior events of the focal type (e.g., acquisitions, alliances) before the year", unit: "log count"}
  executive_compensation: {var: ln_ceo_pay, family: ceo_compensation, kind: continuous, source: archival, label: "CEO compensation", definition: "Natural log of total CEO compensation (salary, bonus, equity grants) in the year", unit: "log USD thousands"}
  ownership_structure:    {var: ownership_concentration, family: ownership_concentration, kind: ratio, source: archival, label: "Ownership concentration", definition: "Share of equity held by the five largest blockholders", unit: "fraction"}
  ceo_characteristics:    {var: ceo_tenure, family: ceo_tenure, kind: continuous, source: archival, label: "CEO tenure", definition: "Years the current CEO has held the position", unit: "years"}
  executive_demographics: {var: ceo_age, family: ceo_age, kind: continuous, source: archival, label: "CEO age", definition: "Age of the CEO in years", unit: "years"}
  board_composition:      {var: board_independence, family: board_independence, kind: ratio, source: archival, label: "Board independence", definition: "Share of directors classified as independent outsiders", unit: "fraction"}
  tmt_composition:        {var: tmt_heterogeneity, family: tmt_heterogeneity, kind: continuous, source: archival, label: "Top management team heterogeneity", definition: "Blau index of functional-background diversity among top executives", unit: "index"}
  network_position:       {var: network_centrality, family: network_centrality, kind: continuous, source: archival, label: "Network centrality", definition: "Eigenvector centrality in the industry alliance network, scaled", unit: "index"}
  technological_relatedness: {var: tech_overlap, family: technological_overlap, kind: ratio, source: archival, label: "Technological overlap", definition: "Share of the firm's patent classes shared with its partners", unit: "fraction"}
  csr_sustainability:     {var: csr_score, family: csr_esg, kind: continuous, source: archival, label: "Social responsibility rating", definition: "Net strengths minus concerns on a third-party social performance rating", unit: "index"}
  adoption_imitation:     {var: practice_adoption, family: adoption_imitation, kind: ratio, source: archival, label: "Practice adoption", definition: "Share of the industry's recently diffused practices the firm has adopted", unit: "fraction"}
  reputation:             {var: reputation_score, family: reputation_status, kind: continuous, source: archival, label: "Corporate reputation", definition: "Standardized reputation rating from an annual survey of executives and analysts", unit: "index"}
  slack_resources:        {var: slack, family: slack, kind: continuous, source: archival, label: "Organizational slack", definition: "Current ratio (current assets over current liabilities), centred", unit: "ratio"}
  human_capital:          {var: workforce_education, family: education, kind: ratio, source: survey, label: "Workforce education", definition: "Share of employees with a university degree", unit: "fraction"}
  competitive_position:   {var: market_share, family: market_share, kind: ratio, source: archival, label: "Market share", definition: "Firm sales divided by four-digit industry sales", unit: "fraction"}
  investment_intensity:   {var: capex_intensity, family: capital_intensity, kind: ratio, source: archival, label: "Capital expenditure intensity", definition: "Capital expenditure divided by total assets", unit: "fraction"}
  vertical_integration:   {var: vertical_integration, family: vertical_integration, kind: ratio, source: archival, label: "Vertical integration", definition: "Share of inputs produced in-house", unit: "fraction"}
  environmental_conditions: {var: env_dynamism, family: environmental_dynamism, kind: continuous, source: archival, label: "Environmental dynamism", definition: "Volatility of industry sales over the prior five years", unit: "index"}
  firm_size:              {var: ln_assets, family: firm_size, kind: continuous, source: archival, label: "Firm size", definition: "Natural log of total assets", unit: "log USD millions"}
  firm_age:               {var: firm_age, family: firm_age, kind: continuous, source: archival, label: "Firm age", definition: "Years since founding", unit: "years"}
  capital_structure:      {var: leverage, family: leverage, kind: ratio, source: archival, label: "Leverage", definition: "Total debt divided by total assets", unit: "fraction"}
  overall_performance:    {var: performance_index, family: performance_generic, kind: continuous, source: survey, label: "Overall performance", definition: "Mean of three executive-rated performance items", unit: "index"}
  competition:            {var: competitive_intensity, family: competitive_intensity, kind: continuous, source: survey, label: "Competitive intensity", definition: "Mean of executive-rated competition items (1-5)", unit: "scale"}
  industry_structure:     {var: industry_concentration, family: industry_concentration, kind: ratio, source: archival, label: "Industry concentration", definition: "Herfindahl index of industry sales", unit: "index"}
# Standard controls pool: names in the dataset, their construct, and their definition
controls:
  - {var: ln_assets, construct: firm_size, label: "Firm size", definition: "Natural log of total assets", unit: "log USD millions"}
  - {var: firm_age, construct: firm_age, label: "Firm age", definition: "Years since founding", unit: "years"}
  - {var: leverage, construct: capital_structure, label: "Leverage", definition: "Total debt divided by total assets", unit: "fraction"}
  - {var: rnd_intensity, construct: innovation_input, label: "R&D intensity", definition: "R&D expenditure divided by sales", unit: "fraction"}
  - {var: prior_roa, construct: accounting_performance, label: "Prior performance", definition: "Return on assets in the previous year", unit: "fraction"}
  - {var: ln_experience, construct: experience_learning, label: "Prior experience", definition: "Natural log of one plus the cumulative count of prior strategic events", unit: "log count"}
moderators_pool: [firm_size, firm_age, environmental_conditions, competition, industry_structure, capital_structure, ownership_structure, board_composition, internationalization, diversification]
