# Model ids per tier and backend. PINNED ids are required for any live API call, so every call is traceable to an exact model.
# The subagent backend records the tier only; the API backends record response.model per call.
# Replace the placeholder ids below with the exact ids chosen at the cost test; a live run refuses "UNPINNED".
# No model is ever called for the warm-start pre-history (journal.timing.warm_start): those quarters are run by the rule
# agents (the mock backend) in every mode, their calls are ledgered as `prehistory` and not charged to the field's budget.
# Realized tokens of every live call (usage.json: total_tokens) are recorded in the same budget row as the tariff debit.
anthropic:
  haiku:  {id: UNPINNED, note: "set to the exact claude-haiku-* id at the cost test"}
  sonnet: {id: UNPINNED, note: "set to the exact claude-sonnet-* id at the cost test"}
  opus:   {id: UNPINNED, note: "set to the exact claude-opus-* id at the cost test"}
  temperature: 0.0
  max_retries: 6
  backoff_seconds: [5, 15, 60, 180, 600, 1800]
openai_compat:
  base_url: http://localhost:8000/v1
  haiku:  {id: UNPINNED}
  sonnet: {id: UNPINNED}
  opus:   {id: UNPINNED}
subagent:
  # Claude Code subagent tiers are selected by the session that dispatches the tasks, via the Agent tool's `model` field.
  haiku: {model: haiku}
  sonnet: {model: sonnet}
  opus: {model: opus}
  max_concurrent: 5
  max_retries: 2
