  desk_reject_null_extra: 0.0
  # weights: ML over the live decisions given the live reviews; intercepts: indirect inference through the rule reviewers
  w_mean_validity: 0.007
  w_reject_votes: -1.149
  w_major_votes: -0.5
  w_accept_votes: 0.6             # declared (kept): no live accept recommendation
  w_log_count_on_question: -0.14
  w_contradiction: -0.695
  intercept_round1: 0.287   # refit (tools/fastcal_refit.py): first fit 0.484; composite target 0.600 = live .541 + engine shortfall 0.059
  intercept_round2: 0.12   # refit: first fit -0.073; composite target 0.295 = composite at the new i1 0.226 + engine shortfall 0.068
  accept_cut_round1: 1.5   # refit: first fit 1.697, moved with intercept_round1 (0/231 live round-1 acceptances)
  revise_band: 1.2                 # declared (kept)
  merit_sd: 6                     # declared (kept)
lab_head:
